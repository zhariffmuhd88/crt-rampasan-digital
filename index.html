<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MyCRT-AID</title>
<meta name="theme-color" content="#16191c">
<meta name="description" content="Panduan langkah demi langkah rampasan peranti digital untuk Cyber Responder Team (CRT), Cawangan Penguatkuasaan Farmasi Sarawak.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/logo.svg" type="image/svg+xml">
<link rel="icon" href="icons/favicon-32.png" type="image/png" sizes="32x32">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="MyCRT-AID">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
/* VOICE: clinical field tool, calm and exact, used under pressure at a raid scene
   IDEA: an evidence tag + exhibit bag — each step is a tag you fill, seal and sign
   PICTURE: the live step card with its photo slots and a working phone / camera demo
   COLOUR and TYPE: steel panel, black ink, lak-rasmi red accent; Inter Tight + Inter, mono for IMEI
   LAYOUT: one column, sticky tabs, step accordion, sticky bottom progress */
:root{color-scheme:light dark;--bg:light-dark(#e3e8ec,#14171a);--card:light-dark(#fff,#1e2226);--ink:light-dark(#111417,#eef1f3);--mut:light-dark(#5b6670,#9aa6b0);--line:light-dark(#cdd4da,#30363c);--red:#e8251a;--redbg:light-dark(#fde8e6,#3a1714);--done:light-dark(#111417,#eef1f3);--field:light-dark(#f4f6f8,#16191c)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Inter,system-ui,sans-serif;overflow-x:clip}
h1,h2,h3{font-family:"Inter Tight",Inter,sans-serif;margin:0;line-height:1.1}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--red);outline-offset:2px}
.top{background:#16191c;color:#eef1f3;padding:14px max(4vw,14px) 0;position:sticky;top:0;z-index:20}
.top .row{display:flex;align-items:center;gap:10px;justify-content:space-between}
.top h1{font-size:20px;display:flex;align-items:center;gap:10px}
.seal{width:22px;height:22px;border-radius:50%;background:var(--red);box-shadow:inset 0 0 0 3px #16191c,0 0 0 2px var(--red);flex:none}
.top small{color:#9aa6b0;font-size:13px}.top small[data-off="1"]::after{content:" · Luar talian";color:#ffd60a}
.tabs{display:flex;gap:2px;margin-top:12px;overflow-x:auto}
.tabs button{flex:1 0 auto;background:none;border:0;color:#9aa6b0;padding:10px 12px;min-height:44px;border-bottom:3px solid transparent;font-weight:600;font-size:15px}
.tabs button.on{color:#fff;border-color:var(--red)}
main{max-width:760px;margin:0 auto;padding:18px max(4vw,14px) 110px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px}
.card h2{font-size:20px;margin-bottom:4px}
.card h3{font-size:16px;margin:14px 0 6px}
.lead{color:var(--mut);font-size:14px;margin:0 0 12px}
label.f{display:block;margin:10px 0 0;font-size:13px;color:var(--mut);font-weight:500}
.inp{display:block;width:100%;margin-top:4px;padding:11px 12px;font-size:16px;border:1px solid var(--line);border-radius:10px;background:var(--field);min-height:44px}
textarea.inp{min-height:76px;resize:vertical}
textarea.sb{min-height:150px;font-size:15px;line-height:1.45}
.mono{font-family:"JetBrains Mono",ui-monospace,monospace;letter-spacing:.02em}
.g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 12px}
@media(max-width:520px){.g2{grid-template-columns:minmax(0,1fr)}}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.chip{border:1px solid var(--line);background:var(--field);border-radius:999px;padding:9px 14px;min-height:44px;font-size:14px;font-weight:500}
.chip.on{background:var(--ink);color:var(--card);border-color:var(--ink)}
.chk{display:flex;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);min-height:48px}
.chk:last-child{border-bottom:0}
.chk input{width:22px;height:22px;accent-color:var(--red);flex:none}
.clock{font:700 clamp(40px,12vw,64px)/1 "Inter Tight",sans-serif;font-variant-numeric:tabular-nums;margin:8px 0}
a{color:var(--red);font-weight:600}
.btn{border:0;border-radius:10px;padding:12px 16px;min-height:44px;font-weight:600;background:var(--ink);color:var(--card)}
.btn.red{background:var(--red);color:#fff}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.arm{background:var(--red);color:#fff}
.btn[disabled]{opacity:.5}
.btnrow{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.dev{display:flex;gap:14px;align-items:center;cursor:pointer}
.tag{flex:none;width:64px;height:64px;border-radius:10px;background:var(--ink);color:var(--card);display:grid;place-items:center;font:700 17px "Inter Tight";position:relative}
.tag::after{content:"";position:absolute;right:-5px;top:-5px;width:14px;height:14px;border-radius:50%;background:var(--red)}
.dev .meta{flex:1}.dev .meta b{display:block;font-size:16px}.dev .meta span{font-size:13px;color:var(--mut)}
.bar{height:6px;background:var(--line);border-radius:6px;overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;background:var(--red)}
.back{background:none;border:0;color:var(--red);font-weight:600;padding:8px 0;min-height:44px}
.step{background:var(--card);border:1px solid var(--line);border-radius:14px;margin-bottom:10px;overflow:hidden}
.step.done{border-color:var(--ink)}
.sh{display:flex;width:100%;gap:12px;align-items:center;text-align:left;background:none;border:0;padding:14px;min-height:60px}
.sh .n{flex:none;width:30px;height:30px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-weight:700;font-size:14px}
.step.done .n{background:var(--done);border-color:var(--done);color:var(--card)}
.sh .tt{flex:1;font-weight:600;font-size:15px;line-height:1.3}
.sh .ref{flex:none;font-size:12px;color:var(--mut);max-width:34%;text-align:right}
.sh .pc{flex:none;font-size:12px;font-weight:700;color:var(--red)}
.sbody{padding:0 14px 16px 56px}
@media(max-width:520px){.sbody{padding-left:14px}.sh .ref{display:none}}
.sbody p{margin:0 0 10px;font-size:15px}
.refl{font-size:12px;color:var(--mut);margin-bottom:8px}
.demo{display:flex;align-items:center;gap:10px;width:100%;border:1px dashed var(--red);background:var(--redbg);color:var(--ink);border-radius:12px;padding:12px;min-height:52px;font-weight:600;text-align:left;margin:4px 0 8px}
.demo .pl{flex:none;width:30px;height:30px;border-radius:50%;background:var(--red);display:grid;place-items:center}
.demo .pl::before{content:"";border-left:10px solid #fff;border-top:6px solid transparent;border-bottom:6px solid transparent;margin-left:3px}
.demo small{display:block;font-weight:400;color:var(--mut);font-size:12px}
.phs{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px;margin-top:10px}
.phs figure{margin:0;position:relative;background:var(--field);border-radius:10px;overflow:hidden;border:1px solid var(--line)}
.phs img{display:block;width:100%;aspect-ratio:1;object-fit:cover;cursor:zoom-in}
.phs figcaption{font-size:11px;padding:4px 6px;color:var(--mut);font-variant-numeric:tabular-nums}
.phs .x{position:absolute;top:4px;right:4px;border:0;border-radius:8px;background:rgba(0,0,0,.65);color:#fff;font-size:12px;min-width:32px;height:32px;padding:0 8px}
.phs .x.arm{background:var(--red)}
.add{display:grid;place-items:center;aspect-ratio:1;border:2px dashed var(--line);border-radius:10px;font-size:13px;font-weight:600;color:var(--mut);cursor:pointer;text-align:center;padding:6px;position:relative}
.add input{position:absolute;width:1px;height:1px;opacity:0}
.need{font-size:12px;color:var(--red);font-weight:600;margin-top:6px}
.pat{position:relative;width:min(240px,100%);aspect-ratio:1;margin:10px 0;background:var(--field);border-radius:14px;border:1px solid var(--line);display:grid;grid-template-columns:repeat(3,1fr)}
.pat svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.pd{background:none;border:0;display:grid;place-items:center;font-size:12px;color:var(--mut);position:relative;z-index:1}
.pd::before{content:"";position:absolute;width:22px;height:22px;border-radius:50%;background:var(--line)}
.pd span{position:relative;top:22px}
.pd.on::before{background:var(--red);box-shadow:0 0 0 6px var(--redbg)}
.statpick{display:flex;gap:8px;margin:6px 0 10px}
.statpick .chip{flex:1;font-size:16px;font-weight:700}
.foot{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);padding:10px max(4vw,14px);z-index:15}
.foot .in{max-width:760px;margin:0 auto;display:flex;align-items:center;gap:12px}
.foot .txt{flex:1;font-size:13px;color:var(--mut)}
.foot .txt b{color:var(--ink);font-size:15px}
.modal{position:fixed;inset:0;background:rgba(10,12,14,.78);z-index:50;display:grid;place-items:center;padding:14px}
.modal[hidden]{display:none}
.mbox{background:var(--card);border-radius:18px;width:min(440px,100%);max-height:94vh;overflow:auto;padding:16px}
.mhead{display:flex;justify-content:space-between;align-items:center;gap:10px}
.mhead h3{font-size:17px}
.close{border:0;background:var(--field);border-radius:10px;min-width:44px;min-height:44px;font-size:20px}
.ostab{display:flex;gap:6px;margin:12px 0}
.ostab .chip{flex:1}
.stage{display:grid;place-items:center;padding:8px 0 4px;min-height:440px}
.cap{min-height:66px;font-size:15px;font-weight:500;text-align:center;margin:8px 0}
.ctl{display:flex;justify-content:center;align-items:center;gap:10px}
.dots{display:flex;gap:5px;justify-content:center;flex-wrap:wrap}
.dots i{width:7px;height:7px;border-radius:50%;background:var(--line)}
.dots i.on{background:var(--red)}
.zoomimg{display:block;max-width:100%;max-height:78vh;margin:10px auto 0;border-radius:10px}
.toast{position:fixed;left:50%;bottom:84px;transform:translateX(-50%);background:var(--ink);color:var(--card);padding:10px 16px;border-radius:10px;font-size:14px;z-index:60;max-width:90vw}
table.la{width:100%;border-collapse:collapse;font-size:14px;margin-top:6px}
table.la td{border-bottom:1px solid var(--line);padding:7px 4px;vertical-align:top}
table.la td:first-child{color:var(--mut);width:42%}
.miss{color:var(--red);font-size:14px;margin:4px 0 0;padding-left:18px}
.sbprev{background:#fff;color:#111;border-radius:6px;padding:14px;font:13px/1.45 Arial,sans-serif;border:1px solid var(--line);margin-top:10px}
.sbprev h4{text-align:center;margin:0;font-size:13px}
.sbprev table{width:100%;border-collapse:collapse;margin-top:8px}
.sbprev th,.sbprev td{border:1px solid #333;padding:5px;vertical-align:top;font-size:12px;white-space:pre-line}
.sbprev th{background:#eee}
/* ---- device mockups ---- */
.phone{position:relative;width:212px;height:430px;border-radius:36px;background:#0b0c0d;padding:8px;box-shadow:0 18px 40px rgba(0,0,0,.35),inset 0 0 0 2px #2b2f33}
.phone .hb{position:absolute;width:4px;border-radius:3px;background:#2b2f33}
.phone .r1{right:-4px;top:120px;height:58px}.phone .l1{left:-4px;top:104px;height:36px}.phone .l2{left:-4px;top:150px;height:36px}
.phone.and .l1,.phone.and .l2{display:none}.phone.and .r0{right:-4px;top:70px;height:44px}.phone.ios .r0{display:none}
.phone .hb.on{background:var(--red);box-shadow:0 0 0 4px rgba(232,37,26,.35);animation:pulse 1s infinite}
.scr{position:relative;width:100%;height:100%;border-radius:29px;overflow:hidden;background:#f2f2f7;color:#111;font:11px/1.35 -apple-system,Inter,sans-serif}
.and .scr{background:#f7f8fa;font-family:Roboto,Inter,sans-serif}
.scr::before{content:"";position:absolute;top:7px;left:50%;transform:translateX(-50%);width:62px;height:18px;border-radius:12px;background:#0b0c0d;z-index:5}
.and .scr::before{width:10px;height:10px;top:9px}
.sbar{display:flex;justify-content:space-between;padding:10px 18px 4px;font-weight:600;font-size:10px}
.nav{color:#0a64d8;padding:2px 12px;height:16px;font-size:11px}
.and .nav{color:#333}
.ttl{font:700 20px/1.1 -apple-system,Inter,sans-serif;padding:2px 12px 8px}
.and .ttl{font-weight:500;font-size:19px}
.grp{background:#fff;margin:0 10px;border-radius:10px;overflow:hidden}
.and .grp{background:transparent;margin:0}
.rw{display:flex;align-items:center;gap:6px;padding:9px 10px;border-bottom:1px solid #e5e5ea;position:relative}
.and .rw{border-bottom:0;padding:10px 14px}
.rw span{flex:1}.rw em{font-style:normal;color:#8a8a8e;font-size:10px;white-space:nowrap}.rw i{color:#c4c4c7;font-style:normal}
.rh{font-size:9px;color:#8a8a8e;padding:10px 10px 3px;background:#f2f2f7;letter-spacing:.02em}
.tg{width:28px;height:16px;border-radius:9px;background:#d6d6d9;position:relative;flex:none;transition:.3s}
.tg::after{content:"";position:absolute;top:2px;left:2px;width:12px;height:12px;border-radius:50%;background:#fff;transition:.3s}
.tg.on{background:#34c759}.and .tg.on{background:#2f6fde}.tg.on::after{left:14px}
.hi{animation:hl 1.2s infinite}
.hi::after{content:"";position:absolute;right:38%;top:50%;width:20px;height:20px;margin-top:-10px;border-radius:50%;background:rgba(232,37,26,.55);box-shadow:0 0 0 6px rgba(232,37,26,.22);animation:pulse 1s infinite;pointer-events:none}
@keyframes hl{50%{background:#ffe1de}}
@keyframes pulse{50%{transform:scale(1.25)}}
.home{display:grid;grid-template-columns:repeat(4,1fr);gap:14px 6px;padding:38px 10px 0;height:100%;background:linear-gradient(160deg,#3d6e8f,#1e2f48)}
.and .home{background:linear-gradient(160deg,#516b5d,#24302b)}
.app{display:flex;flex-direction:column;align-items:center;gap:3px;color:#fff;font-size:9px;position:relative}
.app b{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;font-size:16px;color:#fff}
.and .app b{border-radius:50%}
.app.hi::after{right:auto;left:50%;margin-left:-10px;top:19px}
.swipe{position:absolute;width:24px;height:24px;border-radius:50%;background:rgba(232,37,26,.7);box-shadow:0 0 0 6px rgba(232,37,26,.25);animation:sw 1.4s infinite;z-index:6}
.swipe.tr{right:14px;top:6px}.swipe.tc{left:50%;margin-left:-12px;top:6px}
@keyframes sw{0%{transform:translateY(0);opacity:1}80%{transform:translateY(120px);opacity:.2}100%{opacity:0}}
.dsp{text-align:center;font:300 26px/1 -apple-system,Inter,sans-serif;padding:46px 0 22px;letter-spacing:.06em;height:96px}
.kp{display:grid;grid-template-columns:repeat(3,1fr);gap:8px 14px;padding:0 22px}
.kp span{aspect-ratio:1;border-radius:50%;background:#e2e2e6;display:grid;place-items:center;font-size:18px;position:relative}
.and .kp span{background:transparent}
.kp span.hi{background:#ffb3ad}.kp span.hi::after{display:none}
.pop{position:absolute;inset:0;background:rgba(0,0,0,.35);display:grid;place-items:center;z-index:4}
.pop div{background:#fff;border-radius:12px;width:84%;padding:12px;text-align:center}
.and .pop div{text-align:left;border-radius:18px}
.pop b{display:block;font-size:13px;margin-bottom:6px}
.pop p{margin:3px 0;font-family:"JetBrains Mono",monospace;font-size:9.5px;border-radius:4px;padding:2px}
.pop p.mk{background:#ffe1de;outline:2px solid #e8251a}
.pop u{display:block;text-decoration:none;color:#0a64d8;margin-top:8px;font-weight:600}
.cc{height:100%;background:linear-gradient(160deg,#2c3e52,#151b22);color:#fff}
.ccg{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:30px 16px;background:rgba(255,255,255,.12);border-radius:20px;padding:14px;width:120px}
.cct{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:8px;position:relative}
.cct b{width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,.22);display:grid;place-items:center;font-size:15px}
.cct.on.air b{background:#ff9500}.cct.on.cell b{background:#34c759}.cct.on.wifi b,.cct.on.bt b{background:#0a84ff}
.cct.hi::after{right:auto;left:50%;margin-left:-10px;top:8px}
.qs{height:100%;background:#eef1f6;padding-top:6px}
.qsg{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:10px}
.qt{background:#dfe3ea;border-radius:16px;padding:12px 8px;font-size:10px;font-weight:500;position:relative}
.qt.on{background:#2f6fde;color:#fff}.qt.hi::after{right:10px}
.pw{height:100%;background:rgba(20,22,25,.92);display:flex;flex-direction:column;align-items:center;padding-top:40px;gap:240px}
.sld{width:84%;height:44px;border-radius:24px;background:rgba(255,255,255,.18);position:relative;display:flex;align-items:center;justify-content:center;color:#fff;font-size:11px}
.sld b{position:absolute;left:4px;top:4px;width:36px;height:36px;border-radius:50%;background:#fff;animation:sl 1.6s infinite}
.sld b::after{content:"⏻";color:#e8251a;position:absolute;inset:0;display:grid;place-items:center;font-size:16px}
@keyframes sl{70%,100%{left:calc(100% - 40px)}}
.cancel{color:#fff}
.pwa{position:absolute;inset:0;background:rgba(0,0,0,.55);display:flex;flex-direction:column;justify-content:center;gap:10px;padding:0 26px}
.pb{background:#fff;border-radius:16px;padding:12px;font-size:12px;font-weight:600;position:relative}
.blk{height:100%;background:#000;display:grid;place-items:center;color:#fff}
.boot{font:700 16px Inter;opacity:.9;animation:fade 1.4s infinite alternate}
@keyframes fade{from{opacity:.2}}
.lock{height:100%;background:linear-gradient(170deg,#4a6f9a,#1b2638);color:#fff;text-align:center;padding-top:60px}
.lock b{display:block;font:200 46px/1 -apple-system,Inter,sans-serif}
.lock .lk{margin-top:200px;font-size:10px;opacity:.8}
.chg{height:100%;background:#000;color:#3ddc84;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;font:600 14px Inter}
.chg i{width:46px;height:80px;border:3px solid #3ddc84;border-radius:8px;position:relative}
.chg i::after{content:"";position:absolute;left:4px;right:4px;bottom:4px;height:18%;background:#3ddc84;animation:cg 2s infinite}
@keyframes cg{to{height:60%}}
.chat{height:100%;background:#efe7de}
.chat .hd{background:#075e54;color:#fff;padding:24px 12px 8px;font-weight:600}
.chat .ms{padding:8px;display:flex;flex-direction:column;gap:6px;animation:scr 4s infinite alternate}
@keyframes scr{to{transform:translateY(-40px)}}
.chat .m{max-width:78%;padding:6px 8px;border-radius:8px;background:#fff;font-size:10px;position:relative}
.chat .m.me{align-self:flex-end;background:#dcf8c6}
.chat .m.hi::after{right:4px}
.pin{text-align:center;padding-top:50px}
.pin .pd2{font-size:18px;letter-spacing:6px;margin:12px 0}
.pin .kp{margin-top:10px}
.simwrap{width:280px;background:#f2f4f6;border-radius:16px;padding:16px}
.lap{width:300px}
.lscr{height:188px;border:8px solid #1c1f22;border-radius:12px 12px 0 0;overflow:hidden;position:relative;background:linear-gradient(140deg,#2d6aa0,#173554);font:10px/1.3 "Segoe UI",Inter,sans-serif;color:#111}
.lscr.off{background:#050607}
.lbase{height:12px;background:#b9c0c7;border-radius:0 0 12px 12px;margin:0 -14px}
.tbar{position:absolute;left:0;right:0;bottom:0;height:22px;background:rgba(240,243,246,.92);display:flex;align-items:center;justify-content:center;gap:8px}
.tbar span{width:16px;height:16px;border-radius:4px;background:#c8d0d8;position:relative}
.tbar .stb{background:#0067c0}
.tclk{position:absolute;right:6px;bottom:3px;font-size:8px;text-align:right;line-height:1.1;padding:1px 3px}
.stb.hi::after,.pwb.hi::after{right:auto;left:-2px;top:8px}
.tclk.hi::after{right:auto;left:0;top:4px}
.smenu{position:absolute;left:50%;transform:translateX(-50%);bottom:28px;width:190px;height:130px;background:#f3f4f6;border-radius:8px;padding:8px}
.smenu .apps{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.smenu .apps i{height:16px;border-radius:4px;background:#c8d0d8}
.pwb{position:absolute;right:10px;bottom:8px;width:18px;height:18px;border-radius:50%;border:2px solid #333}

.dlg .bb{display:flex;gap:6px;justify-content:center}
.dlg .bb span{padding:4px 8px;border-radius:5px;background:#e3e3e6;position:relative}
.dlg .bb .pri{background:#0a64d8;color:#fff}
.dlg .bb span.hi::after{right:auto;left:50%;margin-left:-10px}
.brw{position:absolute;inset:0;background:#fff}
.brw .tabsb{display:flex;gap:2px;background:#dfe3e8;padding:4px 4px 0}
.brw .tabsb span{background:#c8ced6;border-radius:5px 5px 0 0;padding:3px 6px;font-size:8px;position:relative}
.brw .tabsb span.on{background:#fff}
.brw .tabsb span.hi::after{right:2px}
.brw .pg{padding:8px;font-size:9px;color:#333}

.desk span::before{content:"";display:block;width:26px;height:30px;margin:0 auto 2px;background:#fff;border-radius:2px}
.desk span.hi::after{right:auto;left:50%;margin-left:-10px;top:6px}

.cbar{position:absolute;top:0;left:0;right:0;height:40px;display:flex;justify-content:space-between;align-items:center;padding:0 16px;color:#fff;font:600 11px Inter,sans-serif}

.cb{position:absolute;width:18px;height:18px;border:2px solid #ffd60a}

.zin{transform-box:view-box;transform-origin:var(--ox,120px) var(--oy,150px);animation:zin 2.4s ease-in-out infinite alternate}

.slidein{animation:sli 2.6s ease-in-out infinite}

.unplug{animation:unp 2.4s ease-in-out infinite}

.sp-ring{transform-box:fill-box;transform-origin:center;animation:spRing .6s cubic-bezier(.2,.9,.3,1.3) both}
.sp-zig{stroke-dasharray:1;stroke-dashoffset:1;animation:spDraw .7s .25s ease-out forwards}
.sp-d{transform-box:fill-box;transform-origin:center;opacity:0;animation:spPop .3s ease-out forwards}
.sp-core{transform-box:fill-box;transform-origin:center;animation:spRing .5s .55s cubic-bezier(.2,.9,.3,1.4) both}
.sp-dash{opacity:0;animation:spFade .4s .9s forwards}
.sp-ph{opacity:0;animation:spUp .45s .85s ease-out forwards}
.sp-mg{transform-box:fill-box;transform-origin:30% 30%;opacity:0;animation:spMg .6s 1.1s cubic-bezier(.2,.9,.3,1.3) forwards}
.sp-word{font:700 30px/1 "Inter Tight",Inter,sans-serif;letter-spacing:-.5px;opacity:0;animation:spUp .5s 1.15s ease-out forwards}
.sp-word b{color:#F5C400}
.sp-sub{font-size:13px;color:#9aa6b0;opacity:0;animation:spFade .5s 1.35s forwards}
@keyframes spRing{from{transform:scale(0) rotate(-120deg)}to{transform:none}}
@keyframes spDraw{to{stroke-dashoffset:0}}
@keyframes spPop{from{opacity:0;transform:scale(0)}to{opacity:1;transform:none}}
@keyframes spFade{to{opacity:1}}
@keyframes spUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}

/* ---------- state ---------- */
const today=()=>new Date().toISOString().slice(0,10);
const blank=()=>({kes:{tarikh:today(),kuasa:[],muka:'CRT'},alat:{},mst:{done:false,photos:[],f:{}},devices:[],view:'kes',dev:null,open:null});
let S=blank();
const uid=()=>Math.random().toString(36).slice(2,9);
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const $=s=>document.querySelector(s);
const fmt=ms=>new Date(ms).toLocaleString('en-GB',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false});
const dmy=iso=>{if(!iso)return '';const [y,m,d]=iso.split('-');return `${+d}/${+m}/${y}`};
const devById=id=>S.devices.find(d=>d.id===id);
const stepsFor=d=>(d.jenis==='phone'?PHONE:PC).filter(s=>!(s.on&&d.status!=='on')&&!(s.off&&d.status!=='off')&&!(s.id==='laptop'&&d.sub==='desktop')).concat(TAIL);
const st=(d,id)=>(d.steps[id]||(d.steps[id]={done:false,photos:[],f:{}}));
const prog=d=>{const l=stepsFor(d);return [l.filter(s=>st(d,s.id).done).length,l.length]};
const fv=(d,sid,k)=>String(st(d,sid).f[k]||'').trim();

/* ---------- persistence ---------- */
let DB=null,saveT=null;
function idb(){return new Promise((res,rej)=>{try{const r=indexedDB.open('crt-rd',1);r.onupgradeneeded=()=>r.result.createObjectStore('kv');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)}catch(e){rej(e)}})}
function save(){clearTimeout(saveT);saveT=setTimeout(()=>{try{if(DB)DB.transaction('kv','readwrite').objectStore('kv').put(JSON.parse(JSON.stringify(S)),'state')}catch(e){}},400)}
idb().then(db=>{DB=db;const q=db.transaction('kv').objectStore('kv').get('state');q.onsuccess=()=>{if(q.result){S=Object.assign(blank(),q.result);render()}}}).catch(()=>{});

/* ---------- Senarai Bongkar wording (gold standard: SPF Sibu, 20/5/2026) ---------- */
const ROM=['i','ii','iii','iv','v','vi','vii','viii'];
const WORDS=['SIFAR','SATU','DUA','TIGA','EMPAT','LIMA','ENAM','TUJUH','LAPAN','SEMBILAN','SEPULUH'];
function sbGen(d){
  const g=(a,b)=>fv(d,a,b);const items=[];let s;
  if(d.jenis==='phone'){
    s=`Telefon bimbit${g('about','warna')?' berwarna '+g('about','warna'):''} berjenama ${[g('about','jenama'),g('about','model')].filter(Boolean).join(' ')||'________'}`;
    if(g('about','modelno'))s+=`, model no: ${g('about','modelno')}`;
    s+=`, No. Siri: ${g('about','siri')||'________'}, IMEI 1: ${g('imei','imei1')||'________'}`;
    if(g('imei','imei2'))s+=`; IMEI 2: ${g('imei','imei2')}`;
    if(g('esim','eid'))s+=`; EID: ${g('esim','eid')}${g('esim','esimtelco')?' (eSIM '+g('esim','esimtelco')+(g('esim','esimno')?', no. talian '+g('esim','esimno'):'')+')':''}`;
    if(g('komponen','telco1')||g('komponen','iccid1'))items.push(`Kad SIM ${g('komponen','telco1')}, No. ICCID: ${g('komponen','iccid1')||'________'}`);
    if(g('komponen','telco2')||g('komponen','iccid2'))items.push(`Kad SIM ${g('komponen','telco2')}, No. ICCID: ${g('komponen','iccid2')||'________'}`);
    if(g('komponen','memjen')||g('komponen','memsiri'))items.push(`Kad memori ${g('komponen','memjen')}${g('komponen','memsiri')?', No. Siri: '+g('komponen','memsiri'):''}`);
    if(g('komponen','batjen')||g('komponen','batsiri'))items.push(`Bateri ${g('komponen','batjen')}${g('komponen','batsiri')?', No. Siri: '+g('komponen','batsiri'):''}`);
    if(g('komponen','casing'))items.push(`Casing ${g('komponen','casing')}`);
    if(items.length)s+=' yang mengandungi:\n'+items.map((x,i)=>`${ROM[i]}) ${x}`).join('\n');
  }else{
    s=`${d.sub==='desktop'?'Unit pemprosesan pusat (CPU)':'Komputer riba'}${g('rekod','warna')?' berwarna '+g('rekod','warna'):''} berjenama ${[g('rekod','jenama'),g('rekod','model')].filter(Boolean).join(' ')||'________'}`;
    if(g('rekod','modelno'))s+=`, model no: ${g('rekod','modelno')}`;
    s+=`, No. Siri: ${g('rekod','siri')||'________'}`;
    if(g('rekod','batjen')||g('rekod','batsiri'))items.push(`Bateri ${g('rekod','batjen')}${g('rekod','batsiri')?', No. Siri: '+g('rekod','batsiri'):''}`);
    if(g('rekod','adpjen')||g('rekod','adpsiri'))items.push(`Power adapter ${g('rekod','adpjen')}${g('rekod','adpsiri')?', No. Siri: '+g('rekod','adpsiri'):''}`);
    if(g('rekod','dongle'))items.push(g('rekod','dongle'));
    if(items.length)s+=' bersama:\n'+items.map((x,i)=>`${ROM[i]}) ${x}`).join('\n');
  }
  return s;
}
const sbText=d=>d.sbText!=null?d.sbText:sbGen(d);
const sbClose=()=>`${WORDS[S.devices.length]||S.devices.length} (${S.devices.length}) perkara sahaja.`;

function vDev(){
  const d=devById(S.dev);if(!d){S.view='ekshibit';return vEks()}
  const list=stepsFor(d);
  let open=S.open;if(open==='__none')open=null;else if(!list.some(s=>s.id===open)){const f=list.find(s=>!st(d,s.id).done);open=f?f.id:null}
  const osOpt=d.jenis==='phone'?['and','ios','lain']:['win','mac'];
  return `<button class="back" data-act="tab" data-v="ekshibit">‹ Semua peranti</button>
  <section class="card"><div class="g2"><label class="f">Tanda barang<input class="inp mono" data-dev="${d.id}" data-dk="tanda" value="${esc(d.tanda)}"></label>

  ${list.map((s,i)=>stepCard(d,s,i,open===s.id)).join('')}`;

function stepCard(d,s,i,open){
  const o=st(d,s.id);const needPh=s.ph&&!o.photos.length&&!s.opt;
  let b='';
  if(open){
    b+=`<div class="sbody"><div class="refl">${s.ref}</div><p>${s.d}</p>`;
    if(s.pick)b+=`<div class="statpick">${['on','off'].map(v=>`<button class="chip ${d.status===v?'on':''}" data-act="status" data-v="${v}">${v.toUpperCase()}</button>`).join('')}</div>`;
    (s.anim||[]).forEach(a=>{b+=`<button class="demo" data-act="anim" data-a="${a}"><span class="pl"></span><span>${F[a].title}<small>${F[a].sub||'Animasi tunjuk cara'}</small></span></button>`});
    if(s.pat)b+=patGrid(d,s.id);
    (s.fields||[]).forEach(([k,l,mono,ph,ty])=>{const v=esc(o.f[k]);b+=`<label class="f">${l}${ty==='area'?`<textarea class="inp" data-dev="${d.id}" data-step="${s.id}" data-k="${k}" placeholder="${esc(ph||'')}">${v}</textarea>`:`<input class="inp ${mono?'mono':''}" type="${ty==='dt'?'datetime-local':'text'}" ${/imei/.test(k)?'inputmode="numeric" maxlength="15"':''} data-dev="${d.id}" data-step="${s.id}" data-k="${k}" value="${v}" placeholder="${esc(ph||'')}">`}</label>`});
    if(s.ph)b+=photos(d.id,s.id,s.opt);
    b+=`<div class="btnrow"><button class="btn ${o.done?'ghost':'red'}" data-act="done" data-step="${s.id}">${o.done?'Batal tanda selesai':s.opt?'Selesai / tidak berkenaan':'Tandakan selesai'}</button></div></div>`;
  }
  return `<section class="step ${o.done?'done':''}" id="st-${s.id}"><button class="sh" data-act="toggle" data-step="${s.id}"><span class="n">${o.done?'✓':i+1}</span><span class="tt">${s.t}${s.opt?' <small style="color:var(--mut);font-weight:400">(jika berkenaan)</small>':''}</span>${needPh&&!open?'<span class="pc">Perlu gambar</span>':''}<span class="ref">${s.ref.split(' · ')[0].replace('K-PK-14 ','')}</span></button>${b}</section>`;
}
function patGrid(d,sid){
  const seq=(st(d,sid).f.pattern||'').split('-').filter(Boolean).map(Number);
  const c=n=>[((n-1)%3)*100+50,Math.floor((n-1)/3)*100+50];
  return `<label class="f">Pattern lock (tekan titik ikut turutan)</label><div class="pat"><svg viewBox="0 0 300 300"><polyline points="${seq.map(c).map(p=>p.join(',')).join(' ')}" fill="none" stroke="#e8251a" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" opacity=".8"/></svg>${[1,2,3,4,5,6,7,8,9].map(n=>`<button class="pd ${seq.includes(n)?'on':''}" data-act="pat" data-n="${n}" aria-label="Titik ${n}"><span>${seq.includes(n)?seq.indexOf(n)+1:''}</span></button>`).join('')}</div>
  <div style="display:flex;gap:10px;align-items:center">Turutan: <b class="mono">${seq.join('-')||'—'}</b><button class="btn ghost" data-act="patclr" style="min-height:36px;padding:6px 12px">Padam</button></div>`;
}

}

function frameHtml(fr,os){
  if(fr.frame==='raw')return fr.s;
  if(fr.frame==='lap')return `<div class="lap"><div class="lscr ${fr.off?'off':''}">${fr.s}</div><div class="lbase"></div></div>`;
  const b=(fr.btn||'').split(' ');
  return `<div class="phone ${os}"><i class="hb r0"></i><i class="hb r1 ${b.includes('r1')?'on':''}"></i><i class="hb l1 ${b.includes('l1')?'on':''}"></i><i class="hb l2"></i><div class="scr">${fr.s}</div></div>`;
}
const OSTAB={ios:'iPhone',and:'Android',win:'Windows',mac:'macOS'};
function drawAnim(){
  const f=F[A.key];const fl=f[A.os];const fr=fl[A.i];
  const keys=Object.keys(OSTAB).filter(k=>f[k]);
  $('#mbox').innerHTML=`<div class="mhead"><h3>${f.title}</h3><button class="close" data-act="close" aria-label="Tutup">×</button></div>
  ${keys.length>1?`<div class="ostab">${keys.map(k=>`<button class="chip ${A.os===k?'on':''}" data-act="aos" data-v="${k}">${OSTAB[k]}</button>`).join('')}</div>`:''}
  <div class="stage">${frameHtml(fr,A.os==='all'?'and':A.os)}</div><div class="cap">${fr.c}</div>
  <div class="ctl"><button class="btn ghost" data-act="aprev" aria-label="Sebelum">‹</button><div class="dots">${fl.map((_,i)=>`<i class="${i===A.i?'on':''}"></i>`).join('')}</div><button class="btn ghost" data-act="anext" aria-label="Seterusnya">›</button></div>`;
  clearTimeout(A.timer);
  if(!reduce&&!A.paused)A.timer=setTimeout(()=>{if($('#modal').hidden)return;A.i=(A.i+1)%fl.length;drawAnim()},fr.d||2000);
}
function openAnim(key,pref){const f=F[key];const os=f.all?'all':(f[pref]?pref:(Object.keys(OSTAB).find(k=>f[k])));A={key,os,i:0,timer:null,paused:false};$('#modal').hidden=false;drawAnim()}
function closeModal(){clearTimeout(A.timer);$('#modal').hidden=true;$('#mbox').innerHTML=''}

function compress(file){return new Promise(res=>{const u=URL.createObjectURL(file);const im=new Image();im.onload=()=>{const m=1600,r=Math.min(1,m/Math.max(im.width,im.height));const c=document.createElement('canvas');c.width=Math.round(im.width*r);c.height=Math.round(im.height*r);c.getContext('2d').drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(u);res({src:c.toDataURL('image/jpeg',.82),w:c.width,h:c.height})};im.onerror=()=>{URL.revokeObjectURL(u);res(null)};im.src=u})}
async function addPhotos(inp){
  const dev=inp.dataset.dev,sid=inp.dataset.step;const o=dev==='_'?S.mst:st(devById(dev),sid);
  for(const f of inp.files){const r=await compress(f);if(r)o.photos.push({...r,t:Date.now(),orig:f.lastModified,name:f.name})}
  save();render();toast('Gambar disimpan dengan cop masa');
}
function toast(m){const t=document.createElement('div');t.className='toast';t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),2400)}
const dims=p=>p.w?Promise.resolve(p):new Promise(r=>{const im=new Image();im.onload=()=>{p.w=im.width;p.h=im.height;r(p)};im.onerror=()=>r(p);im.src=p.src});

async function saveFile(blob,name){
  const touch=matchMedia('(pointer:coarse)').matches;
  try{const file=new File([blob],name,{type:'application/pdf'});
    if(touch&&navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:name});return 'shared'}}
  catch(e){if(e&&e.name==='AbortError')return 'cancel'}
  const u=URL.createObjectURL(blob);const a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),10000);return 'saved';
}
async function exportPDF(btn){
  btn.disabled=true;btn.textContent='Menjana PDF…';
  try{
    const blob=await buildPDF();
    const name=`Laporan_Rampasan_Digital_${(S.kes.noKes||S.kes.tarikh||'kes').replace(/[^\w-]+/g,'_')}.pdf`;
    const r=await saveFile(blob,name);toast(r==='cancel'?'Dibatalkan':'PDF sedia');
  }catch(e){toast(e&&e.message==='nolib'?'Pustaka PDF belum dimuat. Buka app sekali semasa ada internet.':'PDF gagal dijana')}
  btn.disabled=false;btn.textContent='Muat turun laporan PDF';
}

  if(a==='tab'){S.view=el.dataset.v;S.open=null;save();render();scrollTo(0,0)}
  else if(a==='kuasa'||a==='jenis'){const arr=S.kes[a]||(S.kes[a]=[]);const q=el.dataset.q;const i=arr.indexOf(q);i<0?arr.push(q):arr.splice(i,1);save();render()}
  else if(a==='adddev'){const j=el.dataset.j;const ph=j==='phone';const n=S.devices.filter(x=>ph?x.jenis==='phone':x.sub===j).length+1;const dv={id:uid(),jenis:ph?'phone':'pc',sub:ph?null:j,os:ph?'and':'win',tanda:(ph?'HP':j==='laptop'?'LT':'CPU')+String(n).padStart(2,'0'),status:null,steps:{}};S.devices.push(dv);S.dev=dv.id;S.view='dev';S.open=null;save();render();scrollTo(0,0)}
  else if(a==='opendev'){S.dev=el.dataset.id;S.view='dev';S.open=null;render();scrollTo(0,0)}
  else if(a==='deldev')arm(el,'dd'+el.dataset.id,()=>{S.devices=S.devices.filter(x=>x.id!==el.dataset.id);S.view='ekshibit';save();render()});
  else if(a==='reset')arm(el,'reset',()=>{S=blank();save();render()});
  else if(a==='toggle'){S.open=S.open===el.dataset.step?'__none':el.dataset.step;render();go(el.dataset.step)}
  else if(a==='status'&&d){d.status=el.dataset.v;st(d,'status').done=true;save();render()}
  else if(a==='done'&&d){const o=st(d,el.dataset.step);o.done=!o.done;if(o.done)S.open=null;save();render();if(o.done){const nx=stepsFor(d).find(s=>!st(d,s.id).done);nx?go(nx.id):toast('Semua langkah selesai untuk '+d.tanda)}}
  else if(a==='next'&&d){const nx=stepsFor(d).find(s=>!st(d,s.id).done);if(nx){S.open=nx.id;render();go(nx.id)}else{S.view='ringkasan';render();scrollTo(0,0)}}
  else if(a==='anim'&&d){openAnim(el.dataset.a,d.jenis==='phone'?(d.os==='ios'?'ios':'and'):(d.os==='mac'?'mac':'win'))}
  else if(a==='aos'){A.os=el.dataset.v;A.i=0;drawAnim()}
  else if(a==='anext'||a==='aprev'){const l=F[A.key][A.os].length;A.i=(A.i+(a==='anext'?1:l-1))%l;A.paused=true;drawAnim()}
  else if(a==='close')closeModal();
  else if(a==='pat'&&d){const o=st(d,'kunci');const seq=(o.f.pattern||'').split('-').filter(Boolean);const n=el.dataset.n;if(!seq.includes(n))seq.push(n);o.f.pattern=seq.join('-');save();render()}
  else if(a==='patclr'&&d){st(d,'kunci').f.pattern='';save();render()}
  else if(a==='zoom'){const o=el.dataset.dev==='_'?S.mst:st(devById(el.dataset.dev),el.dataset.step);const p=o.photos[+el.dataset.i];$('#modal').hidden=false;$('#mbox').innerHTML=`<div class="mhead"><h3>Gambar · ${fmt(p.t)}</h3><button class="close" data-act="close" aria-label="Tutup">×</button></div><img class="zoomimg" src="${p.src}" alt="">`}
  else if(a==='delph'){arm(el,'p'+el.dataset.step+el.dataset.i,()=>{const o=el.dataset.dev==='_'?S.mst:st(devById(el.dataset.dev),el.dataset.step);o.photos.splice(+el.dataset.i,1);save();render()})}
  else if(a==='sbreset'){const x=devById(el.dataset.id);x.sbText=null;save();render()}
  else if(a==='pdf')exportPDF(el);
  else if(a==='copy'){navigator.clipboard.writeText(textSum()).then(()=>toast('Ringkasan disalin')).catch(()=>toast('Tidak dapat menyalin'))}
});
$('#modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal()});
const refreshPrev=()=>{const p=$('#sbprev');if(p)p.innerHTML=sbPreview()};
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.dataset.kes!==undefined){S.kes[t.dataset.kes]=t.value;if(t.dataset.kes==='noKes')$('#kesno').textContent=t.value;save();refreshPrev()}
  else if(t.dataset.sb){devById(t.dataset.sb).sbText=t.value;save();refreshPrev()}
  else if(t.dataset.k&&t.dataset.dev){st(devById(t.dataset.dev),t.dataset.step).f[t.dataset.k]=t.value;save()}
  else if(t.dataset.dk){const d=devById(t.dataset.dev);d[t.dataset.dk]=t.value;save();if(t.dataset.dk==='os')render();else{foot();refreshPrev()}}
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.matches('[data-photo]'))addPhotos(t);
  else if(t.dataset.alat!==undefined){S.alat[t.dataset.alat]=t.checked;const c=$('#alatc');if(c)c.textContent=Object.values(S.alat).filter(Boolean).length+'/'+ALAT.length;save()}
  else if(t.dataset.mst){S.mst.done=t.checked;save()}
  else if(t.dataset.kesb){S.kes[t.dataset.kesb]=t.checked;save()}
});
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
if('serviceWorker' in navigator&&location.protocol==='https:'){navigator.serviceWorker.register('sw.js').catch(()=>{})}
const net=()=>{const k=$('#kesno');if(k)k.dataset.off=navigator.onLine?'':'1';k&&(k.title=navigator.onLine?'':'Luar talian')};addEventListener('online',net);addEventListener('offline',net);setTimeout(net,0);
setInterval(()=>{const c=$('#clk');if(c)c.textContent=new Date().toLocaleTimeString('en-GB',{hour12:false})},1000);
render();
}
</script>
</body>
</html>
